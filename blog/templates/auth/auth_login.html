{% load widget_tweaks %}


<div class="min-h-screen flex items-center justify-center bg-gray-900">
  <div class="bg-gray-800 p-8 rounded-xl shadow-lg w-full max-w-md text-white">
    <h2 class="text-2xl font-bold mb-6 text-center">Iniciar Sesión</h2>

    <form method="post" class="space-y-5">
      {% csrf_token %}

      <div>
        <label for="{{ form.username.id_for_label }}" class="block mb-1 text-sm font-medium text-gray-300">Usuario</label>
        {{ form.username|add_class:"w-full p-2 rounded bg-gray-700 text-white border border-gray-600" }}
      </div>

      <div>
        <label for="{{ form.password.id_for_label }}" class="block mb-1 text-sm font-medium text-gray-300">Contraseña</label>
        {{ form.password|add_class:"w-full p-2 rounded bg-gray-700 text-white border border-gray-600" }}
      </div>

      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded transition duration-200">
        Ingresar
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="{% url 'user:registro' %}" class="text-sm text-blue-400 hover:underline">
        ¿No tenés cuenta? Registrate
      </a>
    </div>
  </div>
</div>
