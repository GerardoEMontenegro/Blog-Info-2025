{% load widget_tweaks %}
{% load static %}
{% load django_browser_reload %}
{% django_browser_reload_script %}


<header class="bg-[#F6F2E6] text-[#3F4F36] shadow-md">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <a href="{% url 'home' %}" class="text-2xl font-bold tracking-tight">Ikigai Center</a>

    <!-- Botón hamburguesa para móviles -->
    <button id="nav-toggle" class="md:hidden focus:outline-none">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
           xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>

    <!-- Menú de navegación -->
    <nav id="nav-menu" class="hidden md:flex space-x-6 items-center">

      

      {% if user.is_authenticated %}
        <a href="{% url 'user:user_profile' %}" class="flex items-center gap-2 ml-4">
          <img src="{{ user.avatar.url }}" alt="Avatar" class="w-8 h-8 rounded-full object-cover">
          <span class="text-sm">{{ user.username }}</span>
        </a>
        <a href="{% url 'post:post_create' %}" class="text-sm hover:underline">Nuevo Post</a>
        <a href="{% url 'user:logout' %}" class="text-sm hover:underline">Salir</a>
      {% else %}
        <li><a href="{% url 'user:login' %}">login</a></li>
      {% endif %}
    </nav>
  </div>
</header>

<script>
  const navToggle = document.getElementById('nav-toggle');
  const navMenu = document.getElementById('nav-menu');

  navToggle.addEventListener('click', () => {
    navMenu.classList.toggle('hidden');
  });
</script>
